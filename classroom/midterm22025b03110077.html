<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Responsive Product Grid</title>

    <style>
        body {
            font-family: Arial;
            margin: 0;
            padding: 0;
        }

        h1 {
            text-align: center;
            background-color: orange;
            color: white;/
            padding: 15px;
        }

        /* PRODUCT GRID */
        .container {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            padding: 10px;
        }

        .card {
            width: 250px;
            border: 2px solid black;
            margin: 10px;
            padding: 10px;
            background-color: #fbe4b2;
            text-align: center;
            border-radius: 10px;
        }

        .card img {
            width: 100%;
            height: 180px;
            border-radius: 10px;
        }

        .price {
            font-size: 18px;
            font-weight: bold;
            color: green;
        }

        .btn {
            background-color: rgb(255, 123, 0);
            border: none;
            padding: 8px 15px;
            color: white;
            cursor: pointer;
            border-radius: 5px;
        }

        /* RESPONSIVE BREAKPOINT */
        @media (max-width: 600px) {
            .card {
                width: 90%;
            }
        }
    </style>
</head>
<body>

<h1>Product Gallery</h1>

<div class="container">

    <div class="card">
        <img src="https://tse1.mm.bing.net/th/id/OIP.TqRgd0FAlCJEdKQrIgyqtAHaE8?cb=ucfimg2&ucfimg=1&rs=1&pid=ImgDetMain&o=7&rm=3" alt="">
        <h3>Casual Shoes</h3>
        <p class="price">₹999</p>
        <button class="btn">Buy Now</button>
    </div>

    <div class="card">
        <img src="https://tse4.mm.bing.net/th/id/OIP.e2P-jq5BYuZn-XQc6mTyIwAAAA?cb=ucfimg2&ucfimg=1&w=425&h=500&rs=1&pid=ImgDetMain&o=7&rm=3" alt="">
        <h3>Travel Backpack</h3>
        <p class="price">₹1499</p>
        <button class="btn">Buy Now</button>
    </div>

    <div class="card">
        <img src="https://i5.walmartimages.com/asr/f9664c9c-ac23-4326-a4c5-49108c5983f6.cb948f75bc2dc49cf596ee20a20648a1.jpeg" alt="">
        <h3>Smart Watch</h3>
        <p class="price">₹1999</p>
        <button class="btn">Buy Now</button>
    </div>

    <div class="card">
        <img src="https://th.bing.com/th/id/OIP.PlRox5p2yoO9Lg9U3UN6VQHaHa?o=7&cb=ucfimg2&rm=3&ucfimg=1&rs=1&pid=ImgDetMain&o=7&rm=3[[''[]
        
    ]" alt="">
        <h3>Headphones</h3>
        <p class="price">₹799</p>
        <button class="btn">Buy Now</button>
    </div>

</div>

</body>
</html>
