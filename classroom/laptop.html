<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product Card</title>
    <style>
        /* General styling for the page */
        body {
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center; /* Center the card horizontally */
            align-items: center; /* Center the card vertically */
            min-height: 100vh;
            margin: 0;
            background-color: #f4f4f4; /* Light grey background for the page */
        }

        /* Product Card Container Styling */
        .product-card {
            width: 320px; /* Appropriate width for a neat layout */
            background-color: #ffffff; /* White background for the card content */
            border: 2px solid #ff0000; /* Red border as requested */
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
            overflow: hidden; /* Ensures the image doesn't overflow the rounded corners */
        }

        /* Image Styling */
        .product-image {
            width: 100%;
            height: 200px; /* Set a fixed height for the image area */
            overflow: hidden;
            background-color: #cccccc; /* Grey background for the image container */
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .product-image img {
            width: 100%;
            height: 100%;
            object-fit: cover; /* Ensures the image covers the container nicely */
            display: block;
        }

        /* Details Section Styling */
        .product-details {
            padding: 15px;
        }

        .product-title {
            font-size: 1.4em;
            color: #333;
            margin-top: 0;
            margin-bottom: 5px;
        }

        .product-description {
            font-size: 0.9em;
            color: #666;
            margin-bottom: 15px;
        }

        /* Price and Action Layout */
        .price-and-action {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        /* Price Styling */
        .product-price {
            font-size: 1.5em;
            font-weight: bold;
            color: #ff0000; /* Highlight the price in red */
        }

        /* Button Styling */
        .add-to-cart {
            background-color: #333; /* Dark background for contrast */
            color: white;
            border: none;
            padding: 10px 15px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 1em;
            transition: background-color 0.3s;
        }

        .add-to-cart:hover {
            background-color: #555;
        }
    </style>
</head>
<body>
    <div class="product-card">
        <div class="product-image">
            <img src="https://i.imgur.com/Yd7E31K.jpeg" alt="Sleek Modern Laptop">
        </div>
        <div class="product-details">
            <h2 class="product-title">Powerful Pro Laptop</h2>
            <p class="product-description">Experience ultimate performance and portability with this cutting-edge machine.</p>
            <div class="price-and-action">
                <span class="product-price">$1299.00</span>
                <button class="add-to-cart">Add to Cart</button>
            </div>
        </div>
    </div>
</body>
</html>
