<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        body{
            font-family:'georgia',serif;
            background-color: whitesmoke;
            margin:20px;
        }
        .container{
            background-color: lightpink;
            border:2px solid black;
            display: flex;
            justify-content:center;
            align-items:centre;
            gap:40px;
            .card{
                background-color: white;
                width:220px;
                text-align: center;
                border-radius: 10px;
                padding:20px;
                box-shadow: 0 4px 8px rgba(0,0,0,0.5);
                border: 2px solid #007bff;

            }
         .circle {
            background-color: #007bff;
            color: white;
            font-weight: bold;
            font-size: 20px;
            border-radius: 50%;
            width: 70px;
            height: 70px;
            line-height: 70px;
            margin: 0 auto 15px;
         }
         h3{
            margin-bottom: 5px;
            p{
                margin: 5px;
                font-size: 14px;
            }
         }
        }
    </style>
</head>
<body>
    <div class="container">
    </div>
    <div class="card">
          <div class="circle">RK</div>
          <h3>Rohit kumar</h3>
          <p>b.tech-ece</p>
          <p>roll no.21ec1009</p>
          <p>1st year</p>
      </div>
</body>
</html>
